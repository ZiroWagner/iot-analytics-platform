services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: iot-backend:latest
    container_name: stg_backend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL de Supabase es requerida}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET es requerido}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - FRONTEND_URL=${FRONTEND_URL:-http://frontend:3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID es requerido}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET es requerido}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:?GOOGLE_CALLBACK_URL es requerido}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID es requerido}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET es requerido}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:?GITHUB_CALLBACK_URL es requerido}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "3001:3000"
    networks:
      - iot-net
    depends_on:
      - redis
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: iot-frontend:latest
    container_name: stg_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:3000
    ports:
      - "3002:3000"
    networks:
      - iot-net
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:alpine
    container_name: stg_redis
    command: redis-server --appendonly yes
    volumes:
      - stg_redis_data:/data
    networks:
      - iot-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  iot-net:
    external: true # Usa la red de docker-compose.infra.yml

volumes:
  stg_redis_data:
